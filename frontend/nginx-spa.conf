server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El manifest y el icono se piden en cada instalación de la PWA.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
