# Despliegue del proyecto Ticketing en el servidor doméstico.
#
# Convive con Videogames Library, que ya está en producción en esa máquina. Todo
# lo que aquí se define lleva nombre propio — proyecto Compose, contenedores, red
# y volumen — para que ninguna operación sobre este stack pueda tocar el otro.
#
# NO se toca nada del otro proyecto: ni su compose, ni sus .env, ni su base, ni
# su puerto 127.0.0.1:8080.
#
# Uso:
#   cd /srv/ticketing/deploy
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Para parar SOLO este stack (nunca `docker compose down` a secas desde otra
# carpeta, y nunca con -v, que borraría el volumen de datos):
#   docker compose -f docker-compose.prod.yml down

name: ticketing

services:
  postgres:
    image: postgres:17-alpine
    container_name: ticketing-postgres
    # SIN sección ports, a propósito. En desarrollo se publica en 5433 para
    # poder lanzar los tests desde el PC; aquí no se publica en absoluto, y el
    # backend llega por la red interna. Es la diferencia deliberada entre los
    # dos entornos.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Colación por ICU: la imagen alpine va sobre musl y no trae locales del
      # sistema, así que un LANG=es_ES.utf8 se ignora y el cluster queda en C.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - ticketing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [ ticketing-net ]

  backend:
    build:
      context: ../app/backend
      dockerfile: Dockerfile
    container_name: ticketing-backend
    # Sin puertos publicados: solo lo alcanza el nginx de este stack.
    environment:
      # Entre contenedores se usa el nombre del servicio, nunca localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      TICKET_IMAGE_DIR: /data/ticket-images
      # El origen público. Hace falta aunque front y API compartan host: el
      # navegador manda cabecera Origin en los POST y, detrás del proxy, Spring
      # no los reconoce como del mismo origen. Sin esto subir una foto falla con
      # "Invalid CORS request" y el resto de la app parece funcionar bien.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      # Ollama corre en el HOST, no en un contenedor: necesita la GTX 1070 y no
      # tiene sentido meter el paso por nvidia-container-toolkit para un único
      # consumidor. host-gateway es la IP del host desde dentro de la red bridge.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      # Fijado igual que en desarrollo: si difiere, la calidad de extracción que
      # se mide en el PC no predice la del servidor.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX}
      # En la 1070 un ticket denso tarda minutos, no segundos.
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Las imágenes originales son tan importantes como la base: sin ellas no
      # se puede reextraer ni auditar. Van a disco del host, no a un volumen
      # anónimo, para que entren en la copia de seguridad junto al resto.
      - ${TICKETING_STORAGE}/ticket-images:/data/ticket-images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      # El primer arranque corre las migraciones de Flyway.
      start_period: 60s
    restart: unless-stopped
    networks: [ ticketing-net ]

  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile
    container_name: ticketing-frontend
    restart: unless-stopped
    networks: [ ticketing-net ]

  nginx:
    image: nginx:alpine
    container_name: ticketing-nginx
    ports:
      # Ligado a loopback y en 8081, NO en 8080: ese lo ocupa el nginx de
      # Videogames Library. Cloudflare Tunnel es la única entrada pública, así
      # que esto no debe escuchar en 0.0.0.0 bajo ningún concepto.
      # Confirmar antes con: sudo ss -ltnp | grep 8081
      - "127.0.0.1:${HOST_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks: [ ticketing-net ]

volumes:
  ticketing-postgres-data:
    name: ticketing-postgres-data

networks:
  ticketing-net:
    name: ticketing-net
