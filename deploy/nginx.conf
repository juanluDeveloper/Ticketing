# Reverse proxy del stack Ticketing. Mismo reparto que el del otro proyecto,
# para no tener dos convenciones distintas en la misma máquina.
#
# Sin TLS: lo termina Cloudflare. El túnel entra por HTTP a 127.0.0.1:8081.

upstream ticketing_backend {
    server backend:8080;
}

upstream ticketing_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Las fotos de móvil rondan los 3-8 MB; el backend acepta hasta 20.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://ticketing_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # La subida dispara una extracción que en la GTX 1070 puede tardar
        # minutos. La petición HTTP responde enseguida porque el trabajo va
        # asíncrono, pero el margen se deja amplio por si acaso.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /actuator/health {
        proxy_pass http://ticketing_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ticketing_frontend;
        proxy_set_header Host $host;
    }
}
