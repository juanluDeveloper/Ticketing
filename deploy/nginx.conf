# Reverse proxy del stack Ticketing. Mismo reparto que el del otro proyecto,
# para no tener dos convenciones distintas en la misma máquina.
#
# Sin TLS: lo termina Cloudflare. El túnel entra por HTTP a 127.0.0.1:8081.

# DNS interno de Docker. Hace falta porque nginx resuelve los nombres de los
# upstream UNA SOLA VEZ, al arrancar: al reconstruir backend o frontend, Docker
# les da IPs nuevas, nginx sigue apuntando a las viejas y todo el sitio devuelve
# 502 hasta reiniciarlo a mano. Con resolver + proxy_pass por variable, el
# nombre se resuelve en cada petición y los despliegues dejan de romperlo.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Las fotos de móvil rondan los 3-8 MB; el backend acepta hasta 20.
    client_max_body_size 25m;

    location /api/ {
        set $ticketing_backend http://backend:8080;
        proxy_pass $ticketing_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # La subida dispara una extracción que en la GTX 1070 puede tardar
        # minutos. La petición HTTP responde enseguida porque el trabajo va
        # asíncrono, pero el margen se deja amplio por si acaso.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /actuator/health {
        set $ticketing_health http://backend:8080;
        proxy_pass $ticketing_health;
        proxy_set_header Host $host;
    }

    location / {
        set $ticketing_frontend http://frontend:80;
        proxy_pass $ticketing_frontend;
        proxy_set_header Host $host;
    }
}
