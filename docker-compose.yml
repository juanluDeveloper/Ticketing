services:
  postgres:
    image: postgres:17-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      # Colación por ICU: alpine (musl) no trae locales del sistema, así que un
      # LANG=es_ES.utf8 se ignora con un warning y el cluster acaba en C. Con el
      # proveedor ICU el orden alfabético de los nombres de producto respeta
      # acentos y ñ sin depender de locales instalados.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --locale=C.UTF-8 --encoding=UTF8"
    ports:
      # 5433 en el host a propósito: el puerto 5432 lo ocupa el servicio
      # postgresql-x64-18 instalado en Windows. Con 5432 aquí, Docker solo
      # consigue enganchar IPv6 y localhost:5432 acaba yendo a la instancia
      # equivocada, que falla con "autentificación password falló".
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ticketing -d ticketing" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
